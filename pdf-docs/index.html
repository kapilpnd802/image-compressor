<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(180deg, #eceff1 0%, #d7dade 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .container {
            position: relative;
            z-index: 1;
            background: #ffffff;
            padding: 42px;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(55, 66, 84, 0.12);
            max-width: 560px;
            width: 92%;
            border: 1px solid rgba(46, 55, 68, 0.08);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
        }
        .upload-section {
            border: 2px dashed #b4bac4;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 200ms cubic-bezier(.2,.9,.2,1), box-shadow 200ms ease, border-color 200ms ease;
            background: #f9fafb;
            box-shadow: 0 10px 30px rgba(30, 38, 48, 0.07);
            transform: translateZ(0) scale(1);
        }
        .upload-section:hover {
            border-color: #a5abb3;
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 48px rgba(30, 38, 48, 0.12);
        }
        .upload-section:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 8px 22px rgba(30, 38, 48, 0.08);
        }
        .upload-section.drag-over {
            background: #ebf2ff;
            border-color: #6b7cff;
        }
        .upload-section input[type="file"] {
            display: none;
        }
        .upload-label {
            display: block;
            cursor: pointer;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 1.05em;
            font-family: 'Roboto', sans-serif;
        }
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 220ms cubic-bezier(.2,.9,.2,1), box-shadow 220ms ease, opacity 150ms ease;
            transform-origin: center bottom;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .btn:focus { outline: none; }
        .btn-primary {
            background: linear-gradient(180deg, #e7e9ec, #c5c9ce);
            color: #1f2530;
            font-weight: 700;
            box-shadow: 0 12px 28px rgba(35, 43, 55, 0.12);
        }
        .btn-primary:hover,
        .btn-secondary:hover,
        .watermark:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 22px 48px rgba(35, 43, 55, 0.14);
        }
        .btn-primary:active,
        .btn-secondary:active,
        .watermark:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 8px 20px rgba(35, 43, 55, 0.08);
        }
        .btn-secondary {
            background: #f5f7fa;
            color: #222;
            font-weight: 600;
        }
        .info-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            font-size: 0.95em;
            color: #1a1a1a;
        }
        .info-grid div {
            background: #f7f8fa;
            padding: 14px 16px;
            border-radius: 14px;
            box-shadow: inset 0 0 0 1px rgba(33, 36, 41, 0.04);
            font-weight: 600;
        }
        #message {
            margin-top: 16px;
            color: #555;
            font-size: 0.95em;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
            min-height: 22px;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 96px;
            transform: translateX(-50%) translateY(16px);
            background: rgba(33, 43, 66, 0.95);
            color: #fff;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 0.95em;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: transform 260ms ease, opacity 260ms ease;
            z-index: 30;
            box-shadow: 0 18px 35px rgba(12, 19, 32, 0.18);
        }
        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .support {
            margin-top: 20px;
            font-size: 0.9em;
            color: #5c6a82;
            line-height: 1.5;
        }
        .watermark {
            position: fixed;
            right: 28px;
            bottom: 28px;
            z-index: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 2.7rem;
            letter-spacing: 0.45rem;
            pointer-events: auto;
            user-select: none;
            transform: translateZ(0) scale(1);
            transition: transform 260ms ease, opacity 200ms ease, box-shadow 260ms ease;
            text-transform: none;
            max-width: calc(100% - 56px);
            text-shadow: none;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
        }
        .watermark:hover {
            cursor: pointer;
        }
        .watermark.active {
            z-index: 20;
            transform: translateZ(0) scale(1.08);
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.12);
        }
        .watermark span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>
    <div class="watermark"><span>By KapilPandit</span></div>
    <div class="container">
        <h1>PDF to Word Converter</h1>
        <div class="upload-section" id="dropZone">
            <label for="pdfUpload" class="upload-label">
                📁 Click to upload or drag and drop
                <br>
                <small style="color: #333; font-weight: 700; font-family: 'Roboto', sans-serif;">PDF files only, up to 50MB</small>
            </label>
            <input type="file" id="pdfUpload" accept="application/pdf">
        </div>

        <div class="info-grid">
            <div>File size: <strong id="originalSize">—</strong></div>
            <div>Estimated pages: <strong id="pageCount">—</strong></div>
        </div>

        <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;align-items:center;">
            <button id="convertBtn" class="btn btn-primary" disabled style="flex:1; min-width:160px;">Convert to Word</button>
            <a id="downloadLink" class="btn btn-secondary" style="display:none;text-decoration:none;align-items:center;">Download</a>
        </div>

        <div id="message"></div>
        <div id="toast" class="toast" aria-live="polite"></div>

        <div class="support">
            <div>Need help?</div>
            <div id="supportText">If conversion fails, try another PDF or refresh the page</div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.3.0/dist/docx.browser.js"></script>
    <script src="app.js"></script>
    <script>
        const watermark = document.querySelector('.watermark');
        if (watermark) {
            watermark.addEventListener('click', () => {
                watermark.classList.add('active');
                window.setTimeout(() => watermark.classList.remove('active'), 350);
            });
        }
    </script>
</body>
</html>
